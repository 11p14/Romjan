<!doctype html>
<html lang="bn" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GrammarVault - Secure Grammar Learning & Quiz</title>
    <meta name="description" content="Secure English grammar learning portal with PDF notes (Tense, Degree, Narration, Simple-Complex, Completing Sentences), interactive quizzes, live exams, points system, and leaderboard with screenshot and copy protection." />
    <meta property="og:title" content="GrammarVault - Secure Grammar Learning & Quiz" />
    <meta property="og:description" content="Secure English grammar learning portal with PDF notes (Tense, Degree, Narration, Simple-Complex, Completing Sentences), interactive quizzes, live exams, points system, and leaderboard with screenshot and copy protection." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Google Fonts for Bengali & English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
      /* Security and Anti-Theft / DRM Styling */
      * {
        -webkit-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
        user-select: none !important;
        -webkit-touch-callout: none !important;
      }
      
      input, textarea {
        -webkit-user-select: text !important;
        -moz-user-select: text !important;
        user-select: text !important;
      }

      /* Print blocking: Strict blackout/watermark notice */
      @media print {
        html, body {
          display: none !important;
          visibility: hidden !important;
          height: 0 !important;
          overflow: hidden !important;
        }
      }

      body {
        font-family: 'Plus Jakarta Sans', 'Hind Siliguri', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #0b0f19;
        color: #f3f4f6;
        overflow-x: hidden;
      }

      /* Fluid scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0d1322;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334155;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-transparent">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
